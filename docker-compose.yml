version: "3.9"

services:

  backend:
    build:
      context: ./backend/app
    container_name: nest-backend

    ports:
      - "3000:3000"

    restart: unless-stopped

    volumes:
      - ./backend/database.sqlite:/app/database.sqlite

  frontend:
    build:
      context: ./frontend

    container_name: angular-frontend

    ports:
      - "4200:80"

    restart: unless-stopped

    depends_on:
      - backend