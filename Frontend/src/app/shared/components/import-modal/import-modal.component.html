<div
  *ngIf="isOpen"
  class="fixed inset-0 z-[99999] flex items-center justify-center p-3 sm:p-6 md:p-10 animate-in fade-in duration-200"
>
  <!-- Backdrop -->
  <div
    class="fixed inset-0 bg-black/70 backdrop-blur-sm transition-opacity"
    (click)="close()"
  ></div>

  <!-- Modal Dialog -->
  <div
    class="relative w-full max-w-2xl max-h-[92vh] flex flex-col bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 z-10 overflow-hidden animate-in zoom-in-95 duration-200"
    (click)="$event.stopPropagation()"
  >
    <!-- Modal Header -->
    <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100 dark:border-gray-700/80 bg-gray-50/70 dark:bg-gray-800/90 shrink-0">
      <div class="flex items-center space-x-3 min-w-0">
        <div class="flex items-center justify-center w-9 h-9 rounded-xl bg-purple-100 dark:bg-purple-900/40 text-purple-600 dark:text-purple-400 shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
          </svg>
        </div>
        <div class="min-w-0">
          <h3 class="text-base sm:text-lg font-bold text-gray-900 dark:text-white truncate">Import Car Maintenance Data</h3>
          <p class="text-xs text-gray-500 dark:text-gray-400 truncate" *ngIf="carPlate">Vehicle Plate: <span class="font-semibold text-purple-600 dark:text-purple-400">{{ carPlate }}</span></p>
        </div>
      </div>

      <button
        type="button"
        (click)="close()"
        [disabled]="isLoading"
        class="p-1.5 sm:p-2 rounded-xl text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700/60 transition-colors focus:outline-none disabled:opacity-50"
        aria-label="Close modal"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Modal Body (Scrollable) -->
    <div class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-5 custom-scrollbar">
      <!-- Error Alert -->
      <div
        *ngIf="errorMessage"
        class="p-3.5 rounded-xl bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800/50 flex items-start space-x-3 text-red-700 dark:text-red-300 text-xs sm:text-sm animate-in fade-in"
      >
        <svg class="w-5 h-5 shrink-0 text-red-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <div class="flex-1">
          <p class="font-semibold">Import Failed</p>
          <p class="mt-0.5">{{ errorMessage }}</p>
        </div>
      </div>

      <!-- Top Section: Instant File Upload Dropzone -->
      <div>
        <label class="block text-xs sm:text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
          Option 1: Select or Drop a JSON File (Starts immediately)
        </label>
        
        <div
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave($event)"
          (drop)="onDrop($event)"
          [ngClass]="dragOver ? 'border-purple-500 bg-purple-50/60 dark:bg-purple-950/30' : 'border-gray-300 dark:border-gray-600 bg-gray-50/60 dark:bg-gray-750'"
          class="relative border-2 border-dashed rounded-xl p-4 sm:p-5 flex flex-col items-center justify-center text-center transition-all cursor-pointer hover:border-purple-400 dark:hover:border-purple-500 group"
          (click)="fileInput.click()"
        >
          <input
            #fileInput
            type="file"
            accept=".json,application/json"
            (change)="onFileSelected($event)"
            class="hidden"
            [disabled]="isLoading"
          />

          <div class="w-11 h-11 mb-2 rounded-full bg-purple-100 dark:bg-purple-900/50 text-purple-600 dark:text-purple-300 flex items-center justify-center group-hover:scale-110 transition-transform">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
          </div>

          <p class="text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-200">
            <span class="text-purple-600 dark:text-purple-400 font-semibold underline">Click to choose a file</span> or drag & drop here
          </p>
          <p class="text-[11px] text-gray-400 dark:text-gray-400 mt-0.5">Supports exported .json files (auto-starts upon selection)</p>
        </div>
      </div>

      <!-- Divider -->
      <div class="relative flex py-1 items-center">
        <div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
        <span class="flex-shrink mx-3 text-xs font-bold uppercase tracking-wider text-gray-400 dark:text-gray-400">OR PASTE JSON CODE</span>
        <div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
      </div>

      <!-- Bottom Section: Paste Raw JSON Textarea -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="text-xs sm:text-sm font-semibold text-gray-700 dark:text-gray-300">
            Option 2: Paste JSON Content
          </label>
          <button
            type="button"
            (click)="loadSampleTemplate()"
            [disabled]="isLoading"
            class="text-xs font-semibold text-purple-600 dark:text-purple-400 hover:underline flex items-center gap-1 focus:outline-none"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            Insert Sample Template
          </button>
        </div>

        <textarea
          [(ngModel)]="jsonText"
          [disabled]="isLoading"
          rows="7"
          placeholder='{\n  "version": "1.0",\n  "items": [\n    {\n      "name": "Engine Oil",\n      "expectedMaintenanceKm": 10000,\n      "events": []\n    }\n  ]\n}'
          class="w-full font-mono text-xs p-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all outline-none resize-y"
        ></textarea>

        <div class="mt-3 flex items-center justify-end">
          <button
            type="button"
            (click)="onPasteImport()"
            [disabled]="isLoading || !jsonText.trim()"
            class="inline-flex items-center justify-center px-4 py-2 text-xs sm:text-sm font-semibold text-white bg-purple-600 hover:bg-purple-700 active:bg-purple-800 rounded-xl transition-all shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <svg
              *ngIf="isLoading"
              class="animate-spin -ml-1 mr-2 h-4 w-4 text-white"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <svg *ngIf="!isLoading" class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            <span>{{ isLoading ? 'Importing Data...' : 'Confirm & Import Pasted JSON' }}</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="px-5 py-3 border-t border-gray-100 dark:border-gray-700/80 bg-gray-50/70 dark:bg-gray-800/90 flex items-center justify-between shrink-0">
      <span class="text-[11px] text-gray-400 dark:text-gray-400">Items & events are automatically linked and scheduled</span>
      <button
        type="button"
        (click)="close()"
        [disabled]="isLoading"
        class="px-3.5 py-1.5 text-xs sm:text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition-colors focus:outline-none"
      >
        Cancel
      </button>
    </div>
  </div>
</div>
