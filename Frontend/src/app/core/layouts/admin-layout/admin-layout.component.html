<div class="flex h-screen bg-gray-50 dark:bg-gray-900" [ngClass]="{'overflow-hidden': isSideMenuOpen}">
  <!-- Desktop sidebar -->
  <aside class="z-20 hidden w-64 overflow-y-auto bg-gradient-to-b from-purple-900 to-purple-800 dark:from-gray-900 dark:to-gray-800 md:block flex-shrink-0 shadow-lg border-r border-purple-700/50 dark:border-gray-800">
    <app-sidebar></app-sidebar>
  </aside>

  <!-- Mobile sidebar -->
  <!-- Backdrop -->
  <ng-container *ngIf="isSideMenuOpen">
    <div 
      class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm transition-opacity md:hidden" 
      (click)="closeSideMenu()"
    ></div>
    <aside 
      class="fixed inset-y-0 left-0 z-50 flex flex-col w-64 overflow-y-auto bg-gradient-to-b from-purple-900 to-purple-800 dark:from-gray-900 dark:to-gray-800 md:hidden shadow-2xl border-r border-purple-700/50 dark:border-gray-800"
    >
      <div class="flex items-center justify-between px-6 pt-4 pb-2">
        <span class="text-sm font-semibold text-purple-200 uppercase tracking-wider">Navigation</span>
        <button 
          (click)="closeSideMenu()" 
          class="p-1 rounded-lg text-purple-200 hover:text-white hover:bg-purple-700/50 focus:outline-none transition-colors"
          aria-label="Close sidebar"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <app-sidebar></app-sidebar>
    </aside>
  </ng-container>

  <div class="flex flex-col flex-1 w-full">
    <app-header (menuClick)="toggleSideMenu()"></app-header>
    <main class="h-full overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
