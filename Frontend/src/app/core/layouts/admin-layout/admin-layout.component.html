<div class="flex h-screen bg-gray-50 dark:bg-gray-900" [ngClass]="{'overflow-hidden': isSideMenuOpen}">
  <!-- Desktop sidebar -->
  <aside class="z-20 hidden w-64 overflow-y-auto bg-gradient-to-b from-purple-900 to-purple-800 dark:from-gray-900 dark:to-gray-800 md:block flex-shrink-0 shadow-lg border-r border-purple-700/50 dark:border-gray-800">
    <app-sidebar></app-sidebar>
  </aside>

  <!-- Mobile sidebar -->
  <!-- Backdrop -->
  <ng-container *ngIf="isSideMenuOpen">
    <div class="fixed inset-0 z-10 flex items-end bg-black bg-opacity-50 sm:items-center sm:justify-center" (click)="closeSideMenu()"></div>
    <aside class="fixed inset-y-0 z-20 flex-shrink-0 w-64 mt-16 overflow-y-auto bg-gradient-to-b from-purple-900 to-purple-800 dark:from-gray-900 dark:to-gray-800 md:hidden shadow-lg border-r border-purple-700/50 dark:border-gray-800">
      <app-sidebar></app-sidebar>
    </aside>
  </ng-container>

  <div class="flex flex-col flex-1 w-full">
    <app-header></app-header>
    <main class="h-full overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
