<header class="z-10 py-4 bg-white shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)] dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700">
  <div class="container flex items-center justify-between h-full px-6 mx-auto text-purple-600 dark:text-purple-300">
    <!-- Mobile hamburger -->
    <button (click)="onMenuClick()" class="p-1 mr-5 -ml-1 rounded-md md:hidden focus:outline-none focus:shadow-outline-purple" aria-label="Menu">
      <svg class="w-6 h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" />
      </svg>
    </button>
    
    <!-- Search input -->
    <div class="flex justify-center flex-1 lg:mr-32">
      <div class="relative w-full max-w-xl mr-6 focus-within:text-purple-500">
        <div class="absolute inset-y-0 flex items-center pl-3">
          <svg class="w-4 h-4 text-gray-400" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
          </svg>
        </div>
        <input class="w-full pl-10 pr-4 py-2.5 text-sm text-gray-700 placeholder-gray-400 bg-gray-50 border border-transparent rounded-full dark:placeholder-gray-500 dark:focus:shadow-outline-gray dark:focus:placeholder-gray-600 dark:bg-gray-700 dark:text-gray-200 focus:placeholder-gray-500 focus:bg-white focus:border-purple-300 focus:outline-none focus:ring-4 focus:ring-purple-600/10 transition-all duration-200" type="text" placeholder="Search for Cars or Items" aria-label="Search" />
      </div>
    </div>

    <div>
      <ul class="flex justify-end items-center flex-shrink-0 space-x-6">
        <!-- Theme toggler -->
        <li class="flex">
          <button class="rounded-md focus:outline-none focus:shadow-outline-purple" (click)="toggleTheme()" aria-label="Toggle color mode">
            <ng-container *ngIf="!isDark">
              <svg class="w-5 h-5" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
              </svg>
            </ng-container>
            <ng-container *ngIf="isDark">
              <svg class="w-5 h-5" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 1.32a1 1 0 011.415 0l.707.707a1 1 0 01-1.414 1.414l-.707-.707a1 1 0 010-1.414zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zm-1.32 4.22a1 1 0 010 1.415l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 0zM10 18a1 1 0 01-1-1v-1a1 1 0 112 0v1a1 1 0 01-1 1zm-4.22-1.32a1 1 0 01-1.415 0l-.707-.707a1 1 0 011.414-1.414l.707.707a1 1 0 010 1.414zM2 10a1 1 0 011-1h1a1 1 0 110 2H3a1 1 0 01-1-1zm1.32-4.22a1 1 0 010-1.415l.707-.707a1 1 0 011.414 1.414l-.707.707a1 1 0 01-1.414 0zM10 4a6 6 0 100 12 6 6 0 000-12z" clip-rule="evenodd" />
              </svg>
            </ng-container>
          </button>
        </li>
        <!-- Notifications menu -->
        <li class="relative">
          <button class="relative align-middle rounded-md focus:outline-none focus:shadow-outline-purple" (click)="toggleNotificationsMenu()" aria-label="Notifications" aria-haspopup="true">
            <svg class="w-5 h-5" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20">
              <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z" />
            </svg>
            <span aria-hidden="true" class="absolute top-0 right-0 inline-block w-3 h-3 transform translate-x-1 -translate-y-1 bg-red-600 border-2 border-white rounded-full dark:border-gray-800"></span>
          </button>
        </li>
        <!-- Profile menu -->
        <li class="relative">
          <button class="align-middle rounded-full focus:shadow-outline-purple focus:outline-none ring-2 ring-transparent hover:ring-purple-300 transition-all duration-200" (click)="toggleProfileMenu()" aria-label="Account" aria-haspopup="true">
            <img class="object-cover w-9 h-9 rounded-full shadow-sm" src="https://ui-avatars.com/api/?name=Admin+User&background=6D28D9&color=fff&bold=true" alt="" aria-hidden="true" />
          </button>
        </li>
      </ul>
    </div>
  </div>
</header>
