<div class="py-4 text-purple-200 dark:text-gray-400">
  <a class="ml-6 text-xl font-bold tracking-tight text-white dark:text-gray-200 flex items-center gap-2 hover:no-underline"
    routerLink="/dashboard">
    <img
            src="assets/icons/car-white.png"
            class="w-3.5 h-3.5 sm:w-4 sm:h-4 mr-1 opacity-100"
            alt="ODOMETER"
          />
    {{ appName }}
  </a>
  <ul class="mt-6">
    <li class="relative px-6 py-3" *ngFor="let link of links">
      <span *ngIf="isMainLink(link.url)"
        class="absolute inset-y-0 left-0 w-1.5 bg-purple-300 rounded-tr-lg rounded-br-lg shadow-[0_0_8px_rgba(216,180,254,0.6)]"
        aria-hidden="true"></span>

        <a
        [routerLink]="link.url"
        [ngClass]="{
          'text-white bg-purple-800/50 shadow-sm': isMainLink(link.url),
          'text-purple-200 hover:text-white hover:bg-purple-800/30': !isMainLink(link.url)
        }"
        class="inline-flex items-center w-full px-4 py-2.5 text-sm font-semibold transition-all duration-200 rounded-lg hover:no-underline"
      >
        <!-- PNG icon -->
        <img
          *ngIf="link.icon"
          [src]="link.icon"
          [alt]="link.name"
          class="w-5 h-5 object-contain"
        />
      
        <!-- SVG icon -->
        <svg
          *ngIf="link.svg"
          class="w-5 h-5"
          aria-hidden="true"
          [attr.fill]="link.fill ? 'currentColor' : 'none'"
          [attr.stroke]="link.fill ? 'none' : 'currentColor'"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            *ngFor="let s of link.svg"
            [attr.d]="s"
            [attr.fill-rule]="link.fill ? 'evenodd' : null"
            [attr.clip-rule]="link.fill ? 'evenodd' : null"
          ></path>
        </svg>
      
        <span class="ml-4">{{ link.name }}</span>
      </a>
    </li>
  </ul>
</div>
