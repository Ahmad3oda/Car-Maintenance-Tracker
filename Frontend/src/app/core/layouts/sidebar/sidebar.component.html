<div class="flex flex-col h-full py-4 text-gray-600 dark:text-gray-300">
  <a class="flex items-center gap-3 px-4 text-lg font-bold tracking-tight text-gray-900 dark:text-gray-100 hover:no-underline"
    routerLink="/dashboard" [attr.title]="collapsed ? appName : null">
    <span class="logo-mark flex items-center justify-center w-9 h-9 shrink-0 rounded-xl bg-purple-600 text-white p-1.5 shadow-lg shadow-purple-600/30" aria-hidden="true">
      <app-icon name="car" class="w-full h-full"></app-icon>
    </span>
    <span class="nav-label whitespace-nowrap" [class.is-hidden]="collapsed">{{ appName }}</span>
  </a>

  <ul class="mt-8 space-y-1 px-3">
    <li class="relative" *ngFor="let link of links">
      <a
        [routerLink]="link.url"
        [attr.title]="collapsed ? link.name : null"
        [attr.aria-label]="collapsed ? link.name : null"
        [ngClass]="{
          'text-purple-700 dark:text-purple-200 bg-white/70 dark:bg-white/10 shadow-sm ring-1 ring-white/80 dark:ring-white/10': isMainLink(link.url),
          'hover:text-gray-900 dark:hover:text-white hover:bg-white/40 dark:hover:bg-white/5': !isMainLink(link.url)
        }"
        class="flex items-center h-11 px-3 text-sm font-semibold transition-colors duration-200 rounded-xl hover:no-underline"
      >
        <app-icon *ngIf="link.icon" [name]="link.icon" class="w-5 h-5 shrink-0"></app-icon>

        <!-- SVG icon -->
        <svg
          *ngIf="link.svg"
          class="w-5 h-5 shrink-0"
          aria-hidden="true"
          [attr.fill]="link.fill ? 'currentColor' : 'none'"
          [attr.stroke]="link.fill ? 'none' : 'currentColor'"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            *ngFor="let s of link.svg"
            [attr.d]="s"
            [attr.fill-rule]="link.fill ? 'evenodd' : null"
            [attr.clip-rule]="link.fill ? 'evenodd' : null"
          ></path>
        </svg>

        <span class="nav-label ml-3 whitespace-nowrap" [class.is-hidden]="collapsed">{{ link.name }}</span>
      </a>
    </li>
  </ul>
</div>
