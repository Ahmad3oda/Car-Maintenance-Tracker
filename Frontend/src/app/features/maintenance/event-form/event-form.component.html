<div class="w-full max-w-7xl px-4 sm:px-6 lg:px-8 mx-auto min-w-0">
  <!-- Header -->
  <div class="flex items-center my-4 sm:my-6 space-x-3 sm:space-x-4">
    <a [routerLink]="['/cars', carId, 'items', itemId, 'events']" class="text-gray-500 hover:text-purple-600 dark:hover:text-purple-400 transition-colors focus:outline-none focus:ring-2 focus:ring-purple-400 rounded-lg p-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
    </a>
    <div>
      <h2 class="text-xl sm:text-2xl font-bold text-gray-800 dark:text-gray-200">{{ isEditMode ? 'Edit Maintenance Event' : 'Log Maintenance Event' }}</h2>
      <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400">{{ isEditMode ? 'Update the details of this maintenance activity.' : 'Record a new maintenance activity for this item.' }}</p>
    </div>
  </div>

  <div class="p-4 sm:p-6 lg:p-8 mb-8 bg-white rounded-xl shadow-sm border border-gray-100 dark:bg-gray-800 dark:border-gray-700">
    <form [formGroup]="eventForm" (ngSubmit)="onSubmit()">
      
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-8">
        
        <!-- Left Column: Primary Details -->
        <div class="space-y-4 sm:space-y-6">
          <h3 class="text-base sm:text-lg font-medium text-gray-800 dark:text-gray-200 border-b border-gray-100 dark:border-gray-700 pb-2">Event Details</h3>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Maintenance Date -->
            <div>
              <label class="block text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-400 mb-1">
                Date <span class="text-red-500">*</span>
              </label>
              <input
                formControlName="maintenanceDate"
                type="date"
                class="block w-full px-3.5 sm:px-4 py-2 text-xs sm:text-sm bg-white border border-gray-300 rounded-lg shadow-sm focus:border-purple-400 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-opacity-20 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 transition-colors"
              />
            </div>

            <!-- KM Counter -->
            <div>
              <label class="block text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-400 mb-1">
                KM Counter <span class="text-red-500">*</span>
              </label>
              <div class="relative">
                <input
                  formControlName="kmCounter"
                  type="number"
                  class="block w-full pl-3.5 sm:pl-4 pr-12 py-2 text-xs sm:text-sm bg-white border border-gray-300 rounded-lg shadow-sm focus:border-purple-400 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-opacity-20 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 transition-colors"
                  placeholder="0"
                />
                <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400 dark:text-gray-500 text-xs font-medium">
                  KM
                </div>
              </div>
            </div>
          </div>

          <!-- Item Cost -->
          <div>
            <label class="block text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-400 mb-1">
              Item Cost <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <input
                formControlName="itemCost"
                type="number"
                step="0.01"
                class="block w-full pl-3.5 sm:pl-4 pr-14 sm:pr-16 py-2 text-xs sm:text-sm bg-white border border-gray-300 rounded-lg shadow-sm focus:border-purple-400 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-opacity-20 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 transition-colors"
                placeholder="0.00"
              />
              <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400 dark:text-gray-500 text-xs font-medium">
                £
              </div>
            </div>
          </div>

          <!-- Notes -->
          <div>
            <label class="block text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-400 mb-1">
              Notes
            </label>
            <textarea
              formControlName="notes"
              rows="4"
              class="block w-full px-3.5 sm:px-4 py-2 text-xs sm:text-sm bg-white border border-gray-300 rounded-lg shadow-sm focus:border-purple-400 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-opacity-20 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 transition-colors resize-none"
              placeholder="Any additional information..."
            ></textarea>
          </div>
        </div>

        <!-- Right Column: Extra Costs -->
        <div class="space-y-4">
          <div class="flex items-center justify-between border-b border-gray-100 dark:border-gray-700 pb-2">
            <h3 class="text-base sm:text-lg font-medium text-gray-800 dark:text-gray-200">Extra Costs</h3>
            <button type="button" (click)="addExtraCost()" class="inline-flex items-center px-2.5 sm:px-3 py-1 text-xs font-medium text-purple-600 bg-purple-100 rounded-md hover:bg-purple-200 dark:bg-purple-900/30 dark:text-purple-400 dark:hover:bg-purple-900/50 transition-colors focus:outline-none focus:ring-2 focus:ring-purple-400">
              <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
              Add Row
            </button>
          </div>
          
          <div formArrayName="extraCosts" class="space-y-3">
            <div *ngFor="let cost of extraCosts.controls; let i=index" [formGroupName]="i" class="flex flex-col sm:flex-row items-stretch sm:items-start gap-2.5 sm:gap-3 p-3 bg-gray-50 rounded-lg border border-gray-100 dark:bg-gray-700/30 dark:border-gray-700">
              
              <div class="flex-1 min-w-0">
                <label class="sr-only">Cost Name</label>
                <input
                  formControlName="name"
                  placeholder="e.g. Labor, Spray..."
                  class="block w-full px-3 py-2 text-xs sm:text-sm bg-white border border-gray-300 rounded-md shadow-sm focus:border-purple-400 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-opacity-20 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-300 transition-colors"
                />
              </div>

              <div class="flex items-center gap-2 w-full sm:w-auto">
                <div class="flex-1 sm:w-36 relative">
                  <label class="sr-only">Amount</label>
                  <input
                    formControlName="cost"
                    type="number"
                    step="0.01"
                    placeholder="0.00"
                    class="block w-full pl-3 pr-10 py-2 text-xs sm:text-sm bg-white border border-gray-300 rounded-md shadow-sm focus:border-purple-400 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-opacity-20 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-300 transition-colors"
                  />
                  <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400 dark:text-gray-500 text-xs font-medium">
                    £
                  </div>
                </div>
                
                <button type="button" (click)="removeExtraCost(i)" class="p-2 text-red-500 hover:text-red-700 hover:bg-red-50 rounded-md dark:hover:bg-red-900/30 transition-colors focus:outline-none focus:ring-2 focus:ring-red-400 shrink-0" aria-label="Remove">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
              </div>
            </div>

            <div *ngIf="extraCosts.controls.length === 0" class="text-center py-6 text-xs sm:text-sm text-gray-500 dark:text-gray-400 border border-dashed border-gray-200 dark:border-gray-700 rounded-lg">
              No extra costs added. Click 'Add Row' above.
            </div>
          </div>
        </div>

      </div>

      <!-- Action Buttons -->
      <div class="mt-8 sm:mt-10 pt-4 sm:pt-6 border-t border-gray-100 dark:border-gray-700 flex flex-col-reverse sm:flex-row justify-end gap-3 sm:gap-4">
        <a
          [routerLink]="['/cars', carId, 'items', itemId, 'events']"
          class="inline-flex items-center justify-center w-full sm:w-auto px-5 sm:px-6 py-2.5 text-xs sm:text-sm font-medium leading-5 text-gray-700 transition-colors duration-150 bg-white border border-gray-300 rounded-lg dark:text-gray-300 dark:bg-gray-800 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-300 dark:focus:ring-offset-gray-900"
        >
          Cancel
        </a>
        <button
          type="submit"
          [disabled]="eventForm.invalid"
          class="inline-flex items-center justify-center w-full sm:w-auto px-5 sm:px-6 py-2.5 text-xs sm:text-sm font-medium leading-5 text-white transition-colors duration-150 bg-purple-600 border border-transparent rounded-lg active:bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 dark:focus:ring-offset-gray-900 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm"
        >
          {{ isEditMode ? 'Update Event' : 'Save Event' }}
        </button>
      </div>
    </form>
  </div>
</div>
