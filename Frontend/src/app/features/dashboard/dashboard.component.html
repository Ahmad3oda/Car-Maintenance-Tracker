<div class="container px-6 mx-auto grid">
  <app-page-header title="Dashboard"></app-page-header>

  <div class="grid gap-6 mb-8 md:grid-cols-2 xl:grid-cols-4" *ngIf="stats">
    <app-stat-card 
      title="Total Cars" 
      [value]="stats.totalCars" 
      color="orange">
      <svg icon class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
        <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z" />
      </svg>
    </app-stat-card>

    <app-stat-card 
      title="Total Items" 
      [value]="stats.totalItems" 
      color="green">
      <svg icon class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
         <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
      </svg>
    </app-stat-card>

    <app-stat-card 
      title="Maintenance This Month" 
      [value]="stats.maintenanceThisMonth" 
      color="blue">
      <svg icon class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
        <path d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
      </svg>
    </app-stat-card>

    <app-stat-card 
      title="Upcoming Maintenance" 
      [value]="stats.upcomingMaintenance" 
      color="teal">
      <svg icon class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M18 5v8a2 2 0 01-2 2h-5l-5 4v-4H4a2 2 0 01-2-2V5a2 2 0 012-2h12a2 2 0 012 2zM7 8H5v2h2V8zm2 0h2v2H9V8zm6 0h-2v2h2V8z" clip-rule="evenodd" />
      </svg>
    </app-stat-card>
  </div>

  <div class="my-6">
    <h2 class="text-xl font-bold text-gray-800 dark:text-gray-200">Recent Maintenance Events</h2>
  </div>

  <ng-container *ngIf="recentEvents.length > 0; else emptyState">
    <app-table>
      <tr thead>
        <!-- Adding Context Columns for the Dashboard since this is cross-item, but keeping the exact styling -->
        <th class="px-4 py-3">Car</th>
        <th class="px-4 py-3">Item</th>
        <!-- The exact columns from Event List -->
        <th class="px-4 py-3">Date</th>
        <th class="px-4 py-3">KM Counter</th>
        <th class="px-4 py-3">Item Cost</th>
        <th class="px-4 py-3">Extra Costs</th>
        <th class="px-4 py-3">Notes</th>
        <th class="px-4 py-3 text-right">Actions</th>
      </tr>
      
      <ng-container tbody>
        <tr *ngFor="let event of recentEvents" class="text-gray-700 dark:text-gray-400 even:bg-gray-50 dark:even:bg-gray-800/50 hover:bg-purple-50 dark:hover:bg-gray-700 transition-colors">
          <!-- Context columns -->
          <td class="px-4 py-4 text-sm font-semibold text-gray-800 dark:text-gray-200">
            {{ event.carName }}
          </td>
          <td class="px-4 py-4 text-sm font-semibold text-purple-600 dark:text-purple-400">
            {{ event.itemName }}
          </td>
          <!-- Event List identical columns -->
          <td class="px-4 py-4 text-sm font-semibold text-gray-800 dark:text-gray-200">
            {{ event.maintenanceDate }}
          </td>
          <td class="px-4 py-4 text-sm font-medium"> {{ event.kmCounter | number }} </td>
          <td class="px-4 py-4 text-sm font-semibold text-gray-800 dark:text-gray-200"> $ {{ event.itemCost | number:'1.2-2' }} </td>
          <td class="px-4 py-4 text-sm">
            <div class="flex flex-wrap gap-2 max-w-xs" *ngIf="event.extraCosts && event.extraCosts.length > 0; else noExtra">
              <span *ngFor="let cost of event.extraCosts" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-800 border border-gray-200 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 shadow-sm">
                +{{ cost.cost }} {{ cost.name }}
              </span>
            </div>
            <ng-template #noExtra>
              <span class="text-gray-400 dark:text-gray-500 italic">None</span>
            </ng-template>
          </td>
          <td class="px-4 py-4 text-sm text-gray-500 dark:text-gray-400">
            <div class="truncate max-w-xs" [title]="event.notes || ''">
              {{ event.notes || '-' }}
            </div>
          </td>
          <td class="px-4 py-4 text-sm text-right">
            <div class="flex items-center justify-end space-x-2">
              <button class="flex items-center px-2 py-2 text-sm font-medium text-purple-600 rounded-lg dark:text-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-400 hover:bg-purple-100 dark:hover:bg-gray-600 dark:hover:text-gray-200 transition-colors" aria-label="View">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
              </button>
            </div>
          </td>
        </tr>
      </ng-container>
    </app-table>
  </ng-container>

  <ng-template #emptyState>
    <app-empty-state 
      title="No recent events" 
      message="You haven't logged any maintenance events recently."
    >
      <svg icon class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
    </app-empty-state>
  </ng-template>
</div>
