<div class="relative min-h-screen grid lg:grid-cols-2 bg-gray-50 dark:bg-gray-900">
  <!-- Brand panel (large screens) -->
  <aside
    class="relative hidden lg:flex flex-col justify-between m-4 p-10 xl:p-12 overflow-hidden rounded-3xl text-white bg-gradient-to-br from-purple-500 via-purple-700 to-purple-900 dark:from-purple-700 dark:via-purple-800 dark:to-gray-900"
  >
    <!-- Soft lights behind the content -->
    <span class="absolute -top-24 -left-16 w-80 h-80 rounded-full bg-purple-300/30 blur-3xl pointer-events-none"></span>
    <span class="absolute top-1/3 -right-24 w-96 h-96 rounded-full bg-indigo-400/20 blur-3xl pointer-events-none"></span>

    <div class="relative flex items-center gap-3">
      <img src="logo-128.webp" alt="" width="40" height="40" class="w-10 h-10 rounded-xl ring-1 ring-white/30" />
      <span class="text-lg font-semibold tracking-tight">Car Maintenance Tracker</span>
    </div>

    <div class="relative max-w-md">
      <h2 class="text-4xl xl:text-5xl font-bold leading-tight tracking-tight">
        Keep every car<br />road-ready.
      </h2>
      <p class="mt-4 text-base text-white/75 leading-relaxed">
        Track parts, mileage and service history, and know what is due before it is overdue.
      </p>
    </div>

    <div class="relative">
      <!-- Floating status cards, styled like the dashboard -->
      <div class="absolute -top-6 right-2 z-10 float-a">
        <div class="w-52 p-3 rounded-2xl bg-white/15 border border-white/25 backdrop-blur-md shadow-lg">
          <div class="flex items-center justify-between text-xs">
            <span class="font-semibold">Oil change</span>
            <span class="text-white/70">in 1,200 km</span>
          </div>
          <div class="mt-2 h-1.5 rounded-full bg-white/20 overflow-hidden">
            <div class="gauge h-full w-3/4 rounded-full bg-amber-300 origin-left"></div>
          </div>
        </div>
      </div>
      <div class="absolute top-10 left-0 z-10 float-b">
        <div class="flex items-center gap-2 px-3 py-2 rounded-full bg-white/15 border border-white/25 backdrop-blur-md shadow-lg text-xs">
          <span class="w-2 h-2 rounded-full bg-green-400 ring-4 ring-green-400/30"></span>
          <span class="font-semibold">Brake pads</span>
          <span class="text-white/70">Healthy</span>
        </div>
      </div>

      <app-road-scene class="pt-16 -mx-10 xl:-mx-12 -mb-10 xl:-mb-12"></app-road-scene>
    </div>
  </aside>

  <!-- Form column -->
  <main class="relative flex flex-col items-center justify-center px-4 py-10 sm:px-8">
    <div class="w-full max-w-sm">
      <!-- Compact scene on small screens -->
      <div class="lg:hidden mb-8 overflow-hidden rounded-2xl bg-gradient-to-br from-purple-500 via-purple-700 to-purple-900">
        <app-road-scene class="pt-4"></app-road-scene>
      </div>

      <div class="mb-8">
        <h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-gray-100">{{ title }}</h1>
        @if (subtitle) {
          <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">{{ subtitle }}</p>
        }
      </div>

      <ng-content></ng-content>
    </div>
  </main>
</div>
