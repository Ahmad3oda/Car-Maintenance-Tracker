<app-auth-shell title="Welcome back" subtitle="Log in to see what your cars need next.">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-5">
    <div *ngIf="sessionExpired" class="p-3 text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded-xl dark:bg-amber-900/30 dark:text-amber-200 dark:border-amber-800" role="status">
      Your session has expired. Please log in again.
    </div>

    <div *ngIf="formError" class="p-3 text-sm text-red-700 bg-red-50 border border-red-200 rounded-xl dark:bg-red-900/30 dark:text-red-300 dark:border-red-800" role="alert">
      {{ formError }}
    </div>

    <div>
      <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-400 mb-1.5">Username</label>
      <div class="relative">
        <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4" /><path d="M4 20a8 8 0 0 1 16 0" />
        </svg>
        <input
          id="username"
          formControlName="username"
          type="text"
          autocomplete="username"
          placeholder="your_username"
          class="block w-full pl-10 pr-4 py-3 text-sm bg-white border rounded-xl shadow-sm placeholder:text-gray-400 focus:outline-none focus:ring-4 dark:bg-gray-800 dark:text-gray-200 transition-colors"
          [ngClass]="showError('username') ? 'border-red-400 focus:border-red-400 focus:ring-red-400/20' : 'border-gray-300 dark:border-gray-700 focus:border-purple-500 focus:ring-purple-500/15'"
          [attr.aria-invalid]="!!showError('username')"
          [attr.aria-describedby]="showError('username') ? 'username-error' : null"
        />
      </div>
      <p *ngIf="showError('username')" id="username-error" class="mt-1.5 text-xs text-red-600 dark:text-red-400" role="alert">{{ showError('username') }}</p>
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-400 mb-1.5">Password</label>
      <div class="relative">
        <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
          <rect x="5" y="11" width="14" height="9" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" />
        </svg>
        <input
          id="password"
          formControlName="password"
          [type]="showPassword ? 'text' : 'password'"
          autocomplete="current-password"
          placeholder="••••••••"
          class="block w-full pl-10 pr-11 py-3 text-sm bg-white border rounded-xl shadow-sm placeholder:text-gray-400 focus:outline-none focus:ring-4 dark:bg-gray-800 dark:text-gray-200 transition-colors"
          [ngClass]="showError('password') ? 'border-red-400 focus:border-red-400 focus:ring-red-400/20' : 'border-gray-300 dark:border-gray-700 focus:border-purple-500 focus:ring-purple-500/15'"
          [attr.aria-invalid]="!!showError('password')"
          [attr.aria-describedby]="showError('password') ? 'password-error' : null"
        />
        <button
          type="button"
          (click)="showPassword = !showPassword"
          class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-500"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" />
            <path *ngIf="showPassword" d="M4 4l16 16" />
          </svg>
        </button>
      </div>
      <p *ngIf="showError('password')" id="password-error" class="mt-1.5 text-xs text-red-600 dark:text-red-400" role="alert">{{ showError('password') }}</p>
    </div>

    <button
      type="submit"
      [disabled]="submitting"
      class="w-full flex items-center justify-center gap-2 px-4 py-3 text-sm font-semibold text-white bg-purple-600 rounded-xl hover:bg-purple-700 focus:outline-none focus:ring-4 focus:ring-purple-500/30 disabled:opacity-60 disabled:cursor-not-allowed transition-colors"
    >
      <app-wheel-spinner *ngIf="submitting" class="w-4 h-4" label="Logging in"></app-wheel-spinner>
      {{ submitting ? 'Logging in…' : 'Log in' }}
    </button>
  </form>

  <p class="mt-6 text-sm text-center text-gray-600 dark:text-gray-400">
    No account? <a routerLink="/register" class="font-semibold text-purple-600 hover:underline dark:text-purple-400">Create one</a>
  </p>
</app-auth-shell>
