<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Car Maintenance Tracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101315" media="(prefers-color-scheme: dark)">
  <!-- Applies the theme before the first paint, so there is no flash of the
       wrong theme. Same storage key and rules as ThemeService. -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('car_tracker_theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="antialiased">
  <app-root></app-root>
</body>
</html>
